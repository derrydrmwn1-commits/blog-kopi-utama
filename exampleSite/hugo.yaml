baseURL: https://jadwalbola.online/
languageCode: 'id-ID'
title: 'Jadwal Bola Online'
theme: 'kopi'
params:
  subtitle: 'Jadwal Pertandingan Hari Ini, Prediksi Skor, & Berita Bola Terupdate'
  author:
    name: "Redaksi JadwalBola"
    bio: "Menyajikan informasi jadwal siaran langsung sepak bola harian, prediksi skor akurat, dan berita transfer pemain terupdate."
    link: "/about"
    role: "Editor"
  manifest:
    name: 'Jadwal Bola Online'
    short_name: 'JadwalBola'
    start_url: '/'
    display: 'standalone'
    background_color: '#ffffff'
    theme_color: '#2563eb'
    icon: 'images/icon.png'

menus:
  main:
    - name: 'Home'
      pageRef: '/'
      weight: 10
    - name: 'Jadwal Hari Ini'
      pageRef: '/categories/jadwal-bola'
      weight: 20
    - name: 'Berita Terbaru'
      pageRef: '/categories/berita-bola'
      weight: 30
    - name: 'Prediksi Skor'
      pageRef: '/categories/prediksi'
      weight: 40

module:
  hugoVersion:
    extended: true
    min: '0.146.0'

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/radio+json:
    suffixes:
      - json

outputFormats:
  RADIO:
    mediaType: application/radio+json
    baseName: radio
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - RADIO
